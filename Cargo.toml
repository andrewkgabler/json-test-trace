[package]
name = "json-test-trace"
version = "0.3.0"
authors = [
  "Luke Curley <kixelated@gmail.com>",
  "Daniel Mueller <deso@posteo.net>",
]
edition = "2021"
rust-version = "1.71"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/andrewkgabler/json-test-trace"
repository = "https://github.com/andrewkgabler/json-test-trace.git"
readme = "README.md"
categories = [
  "development-tools::testing",
  "development-tools",
  "config",
  "api-bindings",
]
keywords = ["env_logger", "log", "logging", "testing", "tracing"]
description = """
A replacement of the #[test] attribute that initializes
tracing infrastructure before running tests.
"""
include = ["src/lib.rs", "LICENSE-*", "README.md", "CHANGELOG.md"]

[[bin]]
name = "json-test-trace"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "default_log_filter"
path = "tests/default_log_filter.rs"
required-features = ["log", "unstable"]

[features]
default = ["trace", "color", "cli"]
cli = ["dep:clap", "dep:serde", "dep:chrono"]
trace = [
  "dep:tracing-subscriber",
  "dep:tracing",
  "dep:ctor",
  "dep:dtor",
  "dep:serde_json",
  "dep:ctrlc",
  "json-test-trace-macros/trace",
]
log = [
  "dep:env_logger",
  "json-test-trace-macros/log",
  "tracing-subscriber?/tracing-log",
]
color = ["env_logger?/auto-color", "tracing-subscriber?/ansi"]
# Enable unstable features. These are generally exempt from any semantic
# versioning guarantees.
unstable = ["json-test-trace-macros/unstable"]

[dependencies]
json-test-trace-macros = { version = "0.3", path = "macros" }
tracing-subscriber = { version = "0.3.17", default-features = false, optional = true, features = [
  "env-filter",
  "fmt",
  "json",
] }
tracing = { version = "0.1.20", optional = true }
env_logger = { version = "0.11", default-features = false, optional = true }
ctor = { version = "0.2", optional = true }
dtor = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
ctrlc = { version = "3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

[dev-dependencies]
logging = { version = "0.4.8", package = "log" }
test-case = { version = "3.1" }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "time",
] }
tracing = { version = "0.1.20" }
tempfile = "3"

